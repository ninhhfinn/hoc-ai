repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
        # loai tru: file ke hoach nay chua chuoi khoa RSA gia dung de minh hoa
        # buoc kiem thu cua chinh Task 5, khong phai khoa that
        exclude: ^docs/superpowers/plans/2026-08-08-chang-00-nen-mong\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: chan-file-env
        name: Chan commit file .env
        entry: scripts/chan-env.sh
        language: script
        pass_filenames: false
