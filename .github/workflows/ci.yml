name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repo cong khai nen PR tu fork cung chay workflow nay. Chi cho token quyen
# doc ma nguon: workflow khong can ghi gi len repo.
permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    # Job that chay khoang 20 giay. 15 phut la du du de mot buoc treo mang
    # bi cat thay vi chay het gio mien phi cua runner.
    timeout-minutes: 15
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v7

      - name: Cai uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Cai Python 3.12
        run: uv python install 3.12

      - name: Cai phu thuoc dung uv.lock
        run: uv sync --locked

      - name: Kiem tra hang rao chan lo khoa
        run: uv run pre-commit run --all-files

      - name: Lint (soi loi code)
        run: uv run ruff check .

      - name: Kiem tra dinh dang
        run: uv run ruff format --check .

      - name: Kiem tra kieu
        run: uv run mypy

      - name: Chay test
        run: uv run pytest --cov=app --cov-report=term-missing
