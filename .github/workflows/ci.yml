name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repo cong khai nen PR tu fork cung chay workflow nay. Chi cho token quyen
# doc ma nguon: workflow khong can ghi gi len repo.
permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    # Job that chay khoang 20 giay. 15 phut la du du de mot buoc treo mang
    # bi cat thay vi chay het gio mien phi cua runner.
    timeout-minutes: 15
    steps:
      # Ghim ban day du thay vi nhan major troi (@v7, @v9). Hai ly do:
      #
      # 1. Nhan troi khong chac ton tai. `astral-sh/setup-uv` ngung phat hanh
      #    nhan major troi tu sau v7: `v8` va `v9` deu 404, du release moi nhat
      #    la v9.0.0. Viet @v9 lam CI chet ngay o buoc "Set up job".
      # 2. Cung ly do da ghim Python 3.12 va uv.lock: mot lan chay CI phai lap
      #    lai duoc. Nhan troi doi noi dung duoi chan minh.
      #
      # Danh doi: khong tu nhan ban va len. Kiem tra dinh ky bang:
      #   gh api repos/<chu>/<repo>/releases/latest --jq .tag_name
      - name: Lay ma nguon
        uses: actions/checkout@v7.0.1

      - name: Cai uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Cai Python 3.12
        run: uv python install 3.12

      - name: Cai phu thuoc dung uv.lock
        run: uv sync --locked

      - name: Kiem tra khong co file .env bi track
        run: |
          if git ls-files -z | tr '\0' '\n' \
             | grep -vE '(^|/)\.env\.example$' \
             | grep -qE '(^|/)\.env(\.|$)'; then
            echo "LOI: co file .env bi track trong git"
            exit 1
          fi

      - name: Kiem tra hang rao chan lo khoa
        run: uv run pre-commit run --all-files

      - name: Lint (soi loi code)
        run: uv run ruff check .

      - name: Kiem tra dinh dang
        run: uv run ruff format --check .

      - name: Kiem tra kieu
        run: uv run mypy

      - name: Chay test
        run: uv run pytest --cov=app --cov-report=term-missing
